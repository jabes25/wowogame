  <style>
    :root{--cream:#fff8e9;--forest:#173c30;--gold:#e9bd69}

    button,input,select{font-family:'DM Sans',sans-serif}button{cursor:pointer}button:disabled{opacity:.48;cursor:not-allowed}
    :focus-visible{outline:3px solid #f8d386!important;outline-offset:3px}
    #world{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
    #vignette{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,#102b28aa,transparent 75%);transition:opacity .4s}
    #rain-sky{position:absolute;inset:0 0 64%;pointer-events:none;opacity:0;transition:opacity 2s;background-image:repeating-linear-gradient(105deg,transparent 0 28px,#d9e9f080 29px,transparent 30px 57px);background-size:80px 110px;mask-image:linear-gradient(to bottom,#0008,transparent);animation:rainfall 1.5s linear infinite}
    #lightning-sky{position:absolute;inset:0 0 65%;pointer-events:none;background:#eaf0ff;opacity:0;transition:opacity .16s}
    @keyframes rainfall{to{background-position:-34px 110px}}
    @media(prefers-reduced-motion:reduce){#rain-sky{animation:none}}
    .glass{background:#153b32ed;border:1px solid #ffffff30;box-shadow:0 20px 70px #0a221d88;backdrop-filter:blur(12px)}
    .pill{background:linear-gradient(145deg,#173f35e8,#102e29d9);border:1px solid #ffffff38;border-radius:999px;padding:.48rem .8rem;box-shadow:0 8px 24px #071d1940;backdrop-filter:blur(16px)}
    .action{border-radius:14px;padding:.7rem 1rem;background:#e9bd69;color:#20352b;font-weight:700;transition:transform .15s,filter .15s}
    .action:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.08)}
    .secondary{background:#ffffff20;color:#fff8e9;border:1px solid #ffffff40}
    #menu{position:absolute;inset:0;display:flex;align-items:center;padding:clamp(20px,6vw,100px);pointer-events:none}

    #hud{position:absolute;inset:0;pointer-events:none}#hud>*{pointer-events:auto}
    .hud-top{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap}
    .hud-bottom{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:7px;flex-wrap:wrap;justify-content:center;width:min(96%,850px)}
    #hint{position:absolute;top:84px;left:50%;transform:translateX(-50%);text-align:center;max-width:min(92%,570px);pointer-events:none}
    #toast{position:absolute;top:46%;left:50%;transform:translate(-50%,-50%);text-align:center;min-width:220px;z-index:12;pointer-events:none}
    #overlay{position:absolute;inset:0;display:grid;place-items:center;padding:15px;background:#071a17b8;z-index:9}
    [hidden]{display:none!important}
    .modal{width:min(100%,540px);max-height:85%;overflow:auto;padding:25px;border-radius:24px}
    .modal h2{font-family:Fraunces,serif;font-size:1.7rem;margin:0 0 16px}
    .modal h3{font-weight:700;margin-top:20px}
    .modal-row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid #ffffff23}
    .modal-row:last-child{border:0}.small{font-size:.82rem;opacity:.82}
    #xp-track{width:96px;height:5px;background:#ffffff35;border-radius:8px;overflow:hidden;margin-top:5px}
    #xp-fill{height:100%;background:#eabe68}
    #touch{position:absolute;inset:0;pointer-events:none}
    #stick-base{position:absolute;bottom:32px;left:23px;width:124px;height:124px;border-radius:50%;background:#173d378a;border:2px solid #fff9;pointer-events:auto;touch-action:none}
    #stick-knob{position:absolute;left:41px;top:41px;width:40px;height:40px;border-radius:50%;background:#f7d38c}
    .touch-actions{position:absolute;bottom:24px;right:17px;display:grid;grid-template-columns:repeat(2,58px);gap:8px;pointer-events:auto}
    .touch-actions button{height:54px;border-radius:16px;background:#163a33e8;color:white;border:1px solid #ffffff65;font-size:.7rem;font-weight:700}
    #touch-look{position:absolute;right:0;top:19%;width:65%;height:46%;pointer-events:auto;touch-action:none}
    @media(max-width:700px){.hud-bottom{bottom:7px;width:60%}.hud-bottom .action{padding:7px;font-size:.7rem}.hud-top{font-size:.73rem}.pill{padding:.38rem .53rem}#hint{top:111px;font-size:.75rem}#stick-base{bottom:100px}.touch-actions{bottom:98px}.menu-card{background:#153b32f2}}

          else motion.copy(wish).multiplyScalar(speed);
          let x=player.position.x+motion.x*dt,z=player.position.z+motion.z*dt;
          if(inside){x=THREE.MathUtils.clamp(x,-3.55,3.55);z=THREE.MathUtils.clamp(z,-18.1,-12.1)}
          else{
            x=THREE.MathUtils.clamp(x,-45,45);z=THREE.MathUtils.clamp(z,-45,45);
            for(const b of [...buildings,...residentSpecs]){
              const hx=b.w/2+.37,hz=b.d/2+.37;
              if(Math.abs(x-b.x)<hx&&Math.abs(player.position.z-b.z)<hz)x=player.position.x;
              if(Math.abs(x-b.x)<hx&&Math.abs(z-b.z)<hz)z=player.position.z;
              if(Math.abs(x-b.x)<hx&&Math.abs(z-b.z)<hz){
                const left=Math.abs(x-(b.x-hx)),right=Math.abs(x-(b.x+hx)),back=Math.abs(z-(b.z-hz)),front=Math.abs(z-(b.z+hz));
                const nearest=Math.min(left,right,back,front);
                if(nearest===left)x=b.x-hx;else if(nearest===right)x=b.x+hx;else if(nearest===back)z=b.z-hz;else z=b.z+hz;
              }
            }
          }
          player.position.x=x;player.position.z=z;
          const moving=inputLength>.02&&Math.hypot(motion.x,motion.z)>.1;
          if(actionFacing!==null&&elapsed<actionUntil || inputLength>.02&&elapsed>=actionUntil){
            const facing=actionFacing!==null&&elapsed<actionUntil?actionFacing:Math.atan2(motion.x,motion.z);
            player.rotation.y+=Math.atan2(Math.sin(facing-player.rotation.y),Math.cos(facing-player.rotation.y))*(1-Math.exp(-10*dt));
          }
          moveBlend+=(Number(moving)-moveBlend)*(1-Math.exp(-(moving?9:13)*dt));
          if(moving)gait+=dt*(speed>5?12:8.5);
          if(moving&&Math.floor(gait/Math.PI)!==Math.floor((gait-dt*(speed>5?12:8.5))/Math.PI)&&jumpY===0)sound('step');
          velocityY-=16*dt;jumpY=Math.max(0,jumpY+velocityY*dt);if(jumpY===0)velocityY=0;player.position.y=jumpY;
          worldTime=(worldTime+dt/560)%1;updateWeather(dt);updateResidents(dt);
          hudTimer+=dt;plantTimer+=dt;saveTimer+=dt;
          if(hudTimer>=.25){
            hudTimer=0;nearest();
            const hint=inside?'Di rumah · E keluar':nearWell?'E · isi alat penyiram di sumur':nearNPC?'E · bicara dengan '+nearNPC.name:nearBuilding?'E · '+nearBuilding.name:nearPlot>=0?'Petak '+(nearPlot+1)+' · '+(state.plots[nearPlot].type||'kosong'):'Jelajahi kebun · dekati sumur, penduduk, atau petak';
            if($('hint').textContent!==hint)$('hint').textContent=hint;refreshHUD();
          }
          // Pangkal setiap tahap tetap tegak dan menempel pada permukaan petak.
          if(plantTimer>=.8){plantTimer=0;const time=Date.now();plantMeshes.forEach((g,i)=>{if(g)growPlant(i,time)})}
          if(saveTimer>=12){saveTimer=0;save()}
        }else motion.set(0,0,0);
      }else{yaw+=dt*.08;player.position.set(0,0,-10)}
      if(!playing||modal)moveBlend+=(0-moveBlend)*(1-Math.exp(-13*dt));
      updateAction(dt);
      target.set(player.position.x,player.position.y+1.4,player.position.z);
      if(!playing)target.set(0,1,-11);
      const distance=playing?5.5:10;
      desired.set(target.x+Math.sin(yaw)*distance,target.y+2.5+Math.sin(pitch)*distance,target.z+Math.cos(yaw)*distance);
      desired.y=Math.max(.8,desired.y);
      const cameraRay=new THREE.Ray(target.clone(),desired.clone().sub(target).normalize());let safeDistance=target.distanceTo(desired);
      for(const b of [...buildings,...residentSpecs]){const baseY=b.baseY??groundY;const bounds=new THREE.Box3(new THREE.Vector3(b.x-b.w/2-.35,baseY,b.z-b.d/2-.35),new THREE.Vector3(b.x+b.w/2+.35,baseY+(b.id?5:4.25),b.z+b.d/2+.35));const hit=cameraRay.intersectBox(bounds,new THREE.Vector3());if(hit)safeDistance=Math.min(safeDistance,Math.max(.85,target.distanceTo(hit)-.25))}
      desired.copy(target).addScaledVector(cameraRay.direction,safeDistance);
      lockBuildingsToTerrain();
      camera.position.lerp(desired,1-Math.exp(-7*dt));camera.lookAt(target);
      if(sunDisc.visible){const progress=THREE.MathUtils.clamp((worldTime*24-5.45)/13.2,0,1);sunDisc.position.copy(camera.position).add(new THREE.Vector3(-Math.cos(progress*Math.PI)*48,2+Math.sin(progress*Math.PI)*42,-42));}
      renderer.render(scene,camera);
      // Verify after rendering too, including while the camera moves or the frame is redrawn.
      lockBuildingsToTerrain();
    }
    $('continue').disabled=!validSave();
    requestAnimationFrame(frame);
  </script>
